<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zubeldia Store | Camisas de time</title>
<meta name="description" content="Camisas de futebol importadas 1.1 com entrega para todo o Brasil.">
<meta property="og:title" content="Zubeldia Store | Camisas de time">
<meta property="og:description" content="Camisas de futebol importadas 1.1 com entrega para todo o Brasil.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style id="app-style">:root{
  --bg:#F3F1EE;--surface:#FFFFFF;--well:#E8E4DF;--ink:#141212;--ink-2:#5D5752;--line:rgba(20,18,18,.13);
  --red:#C8102E;--red-hover:#A50D25;--on-red:#FFFFFF;--maroon:#141212;--on-maroon:#FFFFFF;--hl:#C8102E;--hl-2:#8E0B20;--disc:#C8102E;--ok:#1E7A45;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E0E;--surface:#1A1818;--well:#242120;--ink:#F3F0EC;--ink-2:#B3ABA3;--line:rgba(243,240,236,.14);
  --red:#E5243B;--red-hover:#F23A50;--on-red:#FFFFFF;--maroon:#C8102E;--on-maroon:#FFFFFF;--hl:#C8102E;--hl-2:#7A0A1B;--disc:#B80E2A;--ok:#4CC27F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E0E;--surface:#1A1818;--well:#242120;--ink:#F3F0EC;--ink-2:#B3ABA3;--line:rgba(243,240,236,.14);
  --red:#E5243B;--red-hover:#F23A50;--on-red:#FFFFFF;--maroon:#C8102E;--on-maroon:#FFFFFF;--hl:#C8102E;--hl-2:#7A0A1B;--disc:#B80E2A;--ok:#4CC27F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.announce{background:var(--maroon);color:var(--on-maroon);text-align:center;font-size:.82rem;font-weight:500;padding:8px 16px}
.announce:empty{display:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1;flex:none}
.brand b{font:900 1.85rem/0.9 var(--display);letter-spacing:.01em}
.brand span{display:flex;align-items:center;gap:6px;font:700 .62rem/1 var(--body);letter-spacing:.32em;color:var(--red);margin-top:3px;padding-left:.32em}
.brand span::before,.brand span::after{content:"";width:12px;height:1.5px;background:currentColor}
.search{flex:1;display:flex;align-items:center;gap:8px;max-width:420px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search svg{flex:none;color:var(--ink-2)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:.95rem}
.search:focus-within{outline:3px solid var(--red);outline-offset:1px}
.bag-btn,.adm-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);flex:none}
.bag-btn{width:42px}
.bag-btn .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--red);color:var(--on-red);font-size:.7rem;font-weight:700;display:grid;place-items:center}
.bag-btn .n[data-zero]{display:none}
.adm-btn{padding:0 14px;font-size:.86rem;font-weight:600}
.adm-btn[hidden]{display:none}
@media (max-width:640px){
  .top-in{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;row-gap:10px}
  .search{order:5;flex-basis:100%;max-width:none;margin:0}
  .brand{margin-right:auto}
  .adm-btn .lbl{display:none}.adm-btn{width:42px;padding:0}
}

.hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:24px;padding-top:32px;padding-bottom:8px}
.hero h1{font:900 clamp(3.6rem,10.5vw,8rem)/.84 var(--display);margin:0 0 18px;letter-spacing:-.005em}
.hero p{max-width:34ch;font-size:1.08rem;color:var(--ink-2);margin:0 0 26px}
.hero-art{position:relative;max-width:440px;justify-self:center;width:100%}
.hero-art svg{width:100%;height:auto;overflow:visible}
.sway{transform-box:view-box;transform-origin:200px 40px;animation:sway 2.4s cubic-bezier(.3,.6,.3,1) .2s both}
@keyframes sway{0%{transform:rotate(-9deg)}35%{transform:rotate(5deg)}65%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:16px;gap:0}
  .hero-art{order:-1;max-width:240px;margin-bottom:-4px}
  .hero h1{font-size:clamp(3.4rem,17vw,5rem)}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:10px;border:0;font-weight:600;font-size:1rem;text-decoration:none;transition:background .15s}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-red:hover{background:var(--red-hover)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:38px;padding:0 14px;font-size:.88rem;border-radius:8px}
.btn-wide{width:100%}

.highlights{display:flex;gap:18px;overflow-x:auto;padding:26px 20px 6px;margin:0 auto;max-width:1200px;scrollbar-width:none}
.highlights::-webkit-scrollbar{display:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;font-size:.86rem;flex:none;width:76px}
.hl i{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--hl),var(--hl-2) 75%);color:var(--on-maroon);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line)}
.hl:hover i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--red)}

.shop{padding-top:34px;padding-bottom:20px}
.shop-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.shop-head h2,.sec-title{font:800 clamp(2rem,5vw,2.8rem)/1 var(--display);margin:0}
.shop-head span{color:var(--ink-2);font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 20px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:22px 12px}}
.card{display:flex;flex-direction:column;justify-content:flex-start;align-self:start;text-align:left;background:none;border:0;padding:0;width:100%}
.card-img{position:relative;aspect-ratio:4/5;border-radius:14px;background:var(--well);overflow:hidden;display:grid;place-items:center}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .shirt{width:78%;height:auto;transition:transform .25s}
.card:hover .card-img .shirt{transform:translateY(-3px)}
.card:hover .card-img img{transform:scale(1.02)}
.card-img img{transition:transform .3s}
.off{position:absolute;top:10px;left:10px;background:var(--red);color:var(--on-red);font-weight:700;font-size:.78rem;padding:4px 7px;border-radius:6px}
.new{position:absolute;bottom:10px;left:10px;background:var(--surface);color:var(--ink);font-weight:600;font-size:.74rem;padding:4px 8px;border-radius:999px}
.sold .card-img>*:not(.soldtag){opacity:.4}
.soldtag{position:absolute;left:10px;bottom:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:.78rem;padding:5px 9px;border-radius:6px}
.card h3{font:600 1rem/1.25 var(--body);margin:12px 0 2px}
.card .ed{font-size:.82rem;color:var(--ink-2);margin:0 0 6px}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:0}
.price s{color:var(--ink-2);font-size:.85rem}
.price strong{font-size:1.12rem;font-weight:700}
.pixline{margin:2px 0 0;font-size:.84rem;color:var(--ok);font-weight:600}
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--ink-2)}
.empty p{margin:0 0 16px}

.info{padding-top:46px;padding-bottom:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.info h3{font:800 1.9rem/1 var(--display);margin:0 0 12px}
.info p{margin:0 0 10px;color:var(--ink-2);max-width:44ch}
@media (max-width:860px){.info{grid-template-columns:1fr;gap:34px}}
.measures{overflow-x:auto}
.measures table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:260px}
.measures th,.measures td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.measures th{font-weight:600}
.measures caption{caption-side:bottom;text-align:left;font-size:.82rem;color:var(--ink-2);padding-top:8px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-weight:400;font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:8px 0 0}

footer{margin-top:30px;background:var(--ink);color:var(--bg)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding-top:34px;padding-bottom:34px}
.foot .brand span{color:#E5243B}
.foot p{margin:0;font-size:.86rem;opacity:.75}
.foot nav{display:flex;gap:10px;flex-wrap:wrap}
.foot nav a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 14px;font-size:.88rem}
:root[data-theme="dark"] .foot nav a{border-color:rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .foot nav a{border-color:rgba(0,0,0,.25)}}

dialog{border:0;padding:0;color:var(--ink);background:var(--surface);max-width:none;max-height:none}
dialog::backdrop{background:rgba(20,14,12,.55)}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

.pm{width:min(940px,calc(100% - 32px));border-radius:18px;margin:auto}
.pm-in{display:grid;grid-template-columns:1fr 1fr;position:relative}
.pm .x{position:absolute;top:12px;right:12px;z-index:2}
.pm-img{background:var(--well);display:grid;place-items:center;aspect-ratio:4/5}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-img .shirt{width:72%}
.pm-info{padding:30px 28px 28px;display:flex;flex-direction:column;gap:14px}
.pm-info h2{font:800 2.3rem/.95 var(--display);margin:0;padding-right:40px}
.pm-info .ed{margin:-8px 0 0;color:var(--ink-2)}
.pm-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pm-price strong{font-size:1.6rem}
.pm-price s{color:var(--ink-2)}
.pm-price .tagoff{background:var(--red);color:var(--on-red);font-weight:700;font-size:.8rem;padding:3px 7px;border-radius:6px}
.pm-pay{margin:-6px 0 0;font-size:.92rem;color:var(--ink-2)}
.pm-pay b{color:var(--ok)}
.sizes{border:0;padding:0;margin:0}
.sizes legend{font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;width:100%}
.sizes legend a{font-weight:500;font-size:.86rem;color:var(--ink-2)}
.size-opts{display:flex;flex-wrap:wrap;gap:8px}
.size-opts label{position:relative}
.size-opts input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.size-opts span{display:grid;place-items:center;min-width:48px;height:44px;padding:0 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:600}
.size-opts input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.size-opts input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.hint{margin:-6px 0 0;font-size:.86rem;color:var(--red);min-height:1.2em}
.stepper{align-self:flex-start;display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;height:44px}
.stepper button{width:40px;height:100%;border:0;background:none;font-size:1.2rem}
.stepper output{min-width:28px;text-align:center;font-weight:600}
.pm-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
@media (max-width:720px){
  .pm{width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
  .pm-in{grid-template-columns:1fr}
  .pm-img{aspect-ratio:auto;height:min(46vh,380px)}
  .pm-img img{object-fit:contain}
  .pm-info{padding:22px 20px 24px}
}

.drawer{margin:0 0 0 auto;height:100%;max-height:100dvh;width:min(440px,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer[open]{display:flex}
.drawer.wide{width:min(620px,100%)}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{font:800 1.9rem/1 var(--display);margin:0}
.dr-body{flex:1;overflow:auto;padding:16px 20px}
.dr-foot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.bag-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.bag-item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start}
.thumb{width:72px;aspect-ratio:4/5;border-radius:10px;background:var(--well);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .shirt{width:80%}
.bag-item h3{font-size:.95rem;margin:0 0 2px;font-weight:600}
.bag-item p{margin:0 0 8px;font-size:.85rem;color:var(--ink-2)}
.bag-item .stepper{height:36px}
.bag-item .stepper button{width:34px}
.bag-item .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);font-size:.84rem;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-size:.95rem}
.tot.big{font-size:1.15rem;font-weight:700}
.tot.pixt{color:var(--ok);font-weight:600}
.small{font-size:.82rem;color:var(--ink-2);margin:0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* painel */
.tabs{display:flex;gap:6px;padding:12px 20px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.note{background:var(--well);border-radius:10px;padding:12px 14px;font-size:.88rem;margin:0 0 16px}
.adm-list{list-style:none;margin:0;padding:0}
.adm-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.adm-row .thumb{width:56px;border-radius:8px}
.adm-row h3{font-size:.95rem;margin:0;font-weight:600}
.adm-row p{margin:2px 0 0;font-size:.82rem;color:var(--ink-2)}
.row-act{display:flex;align-items:center;gap:4px}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib[disabled]{opacity:.3}
.ib.danger{color:var(--red)}
.switch{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2);margin-top:6px}
.switch input{width:18px;height:18px;accent-color:var(--red)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.field legend{font-weight:600;font-size:.9rem}
.field small{color:var(--ink-2);font-size:.8rem}
.field input[type=text],.field input[type=tel],.field input[type=number],.field select,.field textarea{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:1rem;width:100%}
.field textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset.field{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:.9rem;background:var(--bg)}
.checks input{accent-color:var(--red)}
.photo-box{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.photo-box .thumb{width:110px;border-radius:12px}
.photo-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.colors label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--ink-2)}
.colors input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.err{color:var(--red);font-size:.86rem;margin:0;min-height:1.2em}
.faq-row{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.faq-row input,.faq-row textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;width:100%}
.faq-row textarea{min-height:64px;resize:vertical}
.pub{background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
.pub p{margin:0;font-size:.9rem;font-weight:500}
.pub .btns{display:flex;gap:8px}
.pub .btn-line{border-color:var(--bg);color:var(--bg)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--ink)}
.savebar[hidden]{display:none}

.sz{display:none}
.btn-line-inv{background:transparent;border:1.5px solid currentColor;color:inherit}

.hero-c{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:44px;padding-bottom:6px}
.hero-logo{margin-bottom:22px;display:flex;justify-content:center;width:100%}
.lockup{margin:0;display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.lockup b{font:900 clamp(3.6rem,15vw,12rem)/.8 var(--display);letter-spacing:.005em}
.lockup span{display:flex;align-items:center;gap:.6em;font:700 clamp(.95rem,3.2vw,1.7rem)/1 var(--body);letter-spacing:.42em;padding-left:.42em;color:var(--red);margin-top:.55em}
.lockup span::before,.lockup span::after{content:"";width:2.2em;height:.12em;background:currentColor}
.logo-img{width:min(300px,68vw);height:auto;border-radius:50%;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--red)}
.hero-lead{max-width:38ch;font-size:1.1rem;color:var(--ink-2);margin:0 0 24px}
.logo-thumb{aspect-ratio:1/1!important;border-radius:50%!important;padding:0}
.logo-thumb .small{font-size:.72rem;text-align:center}
@media (max-width:760px){.hero-c{padding-top:30px}}

.igd{width:min(480px,calc(100% - 28px));border-radius:18px;margin:auto}
.igd-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.igd-body p{margin:0}
.igd textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--well);padding:12px;font:inherit;font-size:.92rem;line-height:1.45;resize:vertical;color:var(--ink)}
.price .ask{font-size:1rem;color:var(--ink)}
.bulk{border:1px solid var(--line)!important;border-radius:12px;padding:12px!important}

/* janela da camisa: texto sempre separado da foto */
.search input{font-size:16px}
.igd textarea{font-size:16px}
.pm-img{position:relative;overflow:hidden}
.pm-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pm-info h2{font-size:clamp(1.45rem,3.2vw,2.1rem);line-height:1.08;letter-spacing:-.015em;padding-right:44px;text-wrap:balance}
.pm-info .ed{margin:-6px 0 0;font-size:.95rem}
.pm-price strong{font-size:1.5rem}
.pm-price strong.ask{font-size:1.15rem;font-weight:700}
.pm-pay{line-height:1.45}
.pm .x{background:rgba(20,18,18,.55);border-color:rgba(255,255,255,.25);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (max-width:720px){
  .pm{max-height:94dvh}
  .pm-img{height:min(50vh,430px)}
  .pm-img img{object-fit:contain}
  .pm-info{position:relative;z-index:1;margin-top:-22px;border-radius:22px 22px 0 0;background:var(--surface);padding:24px 20px calc(26px + env(safe-area-inset-bottom,0px));gap:12px}
  .pm-info h2{font-size:1.5rem}
}
/* logo no topo */
.brand{flex-direction:row;gap:10px}
.brand .brand-word{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-style:normal}
.brand-logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}
.foot .brand-logo{width:56px;height:56px}
/* edição na tela */
.editbar{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);max-width:calc(100% - 24px)}
.editbar[hidden]{display:none}
.editbar p{margin:0 4px;font-size:.86rem}
.editbar.on{border-color:var(--red)}
.savebar:not([hidden]) ~ .editbar{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.editing [data-edit]{outline:2px dashed var(--red);outline-offset:3px;border-radius:4px;cursor:text;min-width:1ch;display:inline-block}
.editing .announce[data-edit]{display:block;outline-offset:-4px}
.editing [data-edit]:focus{outline-style:solid;background:rgba(200,16,46,.06)}
.editing .vcard,.editing .card{outline:2px dashed transparent;outline-offset:4px;border-radius:16px}
.editing .vcard:hover,.editing .card:hover{outline-color:var(--red)}
.leave{display:block;margin:0 0 12px}

.editbar:not([hidden]) ~ .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.savebar:not([hidden]) ~ .editbar:not([hidden]) ~ .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.pub p{font-size:.84rem;line-height:1.3}
/* ===== Vitrine ===== */
:root{--display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#FBFAF9;--surface:#FFFFFF;--well:#F1EFEC;--ink:#101012;--ink-2:#64626A;--line:rgba(16,16,18,.1);
  --red:#D0102B;--red-hover:#AE0C23;--maroon:#101012;--hero:#F1EFEC;--ok:#1E7A45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0C0D;--surface:#151517;--well:#1C1C1F;--ink:#F3F2F0;--ink-2:#A3A1A8;--line:rgba(243,242,240,.1);
  --red:#EE2643;--red-hover:#FF3F5A;--maroon:#000;--hero:#151517;--ok:#4CC27F}}
:root[data-theme="dark"]{
  --bg:#0C0C0D;--surface:#151517;--well:#1C1C1F;--ink:#F3F2F0;--ink-2:#A3A1A8;--line:rgba(243,242,240,.1);
  --red:#EE2643;--red-hover:#FF3F5A;--maroon:#000;--hero:#151517;--ok:#4CC27F}
.brand b{font-family:var(--display);font-weight:800;letter-spacing:-.01em;font-size:1.6rem}
.btn{border-radius:12px}
.btn-plain{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;padding:0 10px}
.vit-hero{background:var(--hero);overflow:hidden}
.vit-in{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:30px;min-height:min(600px,74vh);padding-top:40px;padding-bottom:40px}
.vit-copy h1{font:800 clamp(3.2rem,7.6vw,6.6rem)/.92 var(--display);letter-spacing:-.045em;margin:0 0 20px;max-width:8ch}
.vit-copy p{font-size:1.1rem;color:var(--ink-2);max-width:36ch;margin:0 0 28px}
.vit-cta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vit-perks{list-style:none;padding:0;margin:34px 0 0;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:.92rem;color:var(--ink-2)}
.vit-perks li[hidden]{display:none}
.vit-perks b{color:var(--ink);font-weight:700}
.vit-perks li{display:flex;align-items:center;gap:6px}
.vit-perks li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
.vit-fan{position:relative;height:min(480px,60vh);min-height:340px}
.fan-card{position:absolute;top:50%;left:50%;width:min(250px,44%);border:0;padding:10px 10px 14px;background:var(--surface);border-radius:20px;text-align:left;box-shadow:0 24px 50px -18px rgba(16,16,18,.35);transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.fan-card.f0{z-index:3;transform:translate(-50%,-50%) rotate(0)}
.fan-card.f1{z-index:2;transform:translate(-110%,-46%) rotate(-9deg)}
.fan-card.f2{z-index:1;transform:translate(10%,-46%) rotate(9deg)}
.fan-card.f1:hover{transform:translate(-114%,-50%) rotate(-11deg)}
.fan-card.f2:hover{transform:translate(14%,-50%) rotate(11deg)}
.fan-card.f0:hover{transform:translate(-50%,-54%)}
.fan-img{aspect-ratio:4/5;border-radius:12px;background:var(--well);display:grid;place-items:center;overflow:hidden}
.fan-img img{width:100%;height:100%;object-fit:cover}
.fan-img .shirt{width:80%;height:auto}
.fan-cap{display:flex;flex-direction:column;gap:2px;padding:10px 4px 0;font-size:.86rem}
.fan-cap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){
  .vit-in{grid-template-columns:1fr;min-height:0;padding-top:28px;gap:6px}
  .vit-fan{order:-1;height:300px;min-height:0}
  .fan-card{width:36%}
  .qa span{display:none}
  .qa{gap:5px}
  .qa button{min-width:30px;height:28px;padding:0 5px;font-size:.76rem}
  .fan-cap{display:none}
}
.shop{padding-top:52px}
.shop-head{align-items:center;flex-wrap:wrap}
.shop-head h2{font-family:var(--display);font-weight:800;letter-spacing:-.035em;font-size:clamp(2rem,4.6vw,3rem);margin-right:auto}
.sort select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-weight:500}
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;background:var(--bg);padding-top:10px;margin-top:-4px}
@media (max-width:640px){.chips{top:calc(env(safe-area-inset-top,0px) + 116px)}}
.chip{border-radius:10px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.grid{gap:36px 20px}
.vcard{display:flex;flex-direction:column;min-width:0}
.vcard .card-img{border:0;padding:0;width:100%;cursor:pointer;border-radius:18px}
.vcard .card-img .shirt{width:76%;transition:transform .3s}
.vcard:hover .card-img .shirt{transform:scale(1.04)}
.qa{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.qa span{font-size:.78rem;color:var(--ink-2);margin-right:2px}
.qa button{min-width:34px;height:30px;padding:0 7px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600}
.qa button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (hover:hover) and (min-width:821px){
  .vcard{position:relative}
  .qa{position:absolute;left:10px;right:10px;margin:0;top:calc((100% - 0px) * 0);transform:translateY(8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:var(--surface);border-radius:12px;padding:8px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
  .vcard:hover .qa,.vcard:focus-within .qa{opacity:1;transform:none;pointer-events:auto}
}
.vc-body h3{margin:12px 0 2px;font:600 1rem/1.25 var(--body)}
.vc-body h3 button{all:unset;cursor:pointer}
.vc-body h3 button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.vc-body .ed{font-size:.82rem;color:var(--ink-2);margin:0 0 6px}
.off{border-radius:8px}
.new{background:var(--ink);color:var(--bg);border-radius:8px}
.info h3,.dr-head h2,.pm-info h2{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.pm{border-radius:22px}
/* contagem da final */
.final{background:#006437;color:#fff;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 56px,transparent 56px 112px)}
.final-in{display:grid;grid-template-columns:1.1fr auto auto;align-items:center;gap:20px 36px;padding-top:30px;padding-bottom:30px}
.final h2{font:800 clamp(1.7rem,3.4vw,2.5rem)/1 var(--display);letter-spacing:-.035em;margin:0 0 6px;color:#fff}
.final p{margin:0;color:rgba(255,255,255,.82);max-width:40ch;font-size:.95rem}
.final-clock{display:flex;gap:8px}
.final-clock[hidden],.final-live[hidden]{display:none}
.fu{display:flex;flex-direction:column;align-items:center;min-width:64px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 6px 8px}
.fn{font:800 2.4rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fl{font-size:.74rem;color:rgba(255,255,255,.75);margin-top:4px}
.final-live{font:800 1.4rem/1.15 var(--display)!important;color:#fff!important}
.final-btn{background:#fff;color:#006437;white-space:nowrap}
.final-btn:hover{background:#E7F3EC}
.final-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-width:900px){
  .final-in{grid-template-columns:1fr;gap:16px;padding-top:24px;padding-bottom:26px}
  .final-clock{display:grid;grid-template-columns:repeat(4,1fr)}
  .fu{min-width:0}
  .final-btn{width:100%}
}
</style>
</head>

  function compressImage(file, maxSide, alpha) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = reject;
      fr.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var max = maxSide || 900, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var d = c.toDataURL('image/webp', 0.8);
          if (d.indexOf('data:image/webp') !== 0) d = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82);
          resolve(d);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function downloadStore() {
    try {

      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      saved = clone(state);

  function publishSite() {
    var senha = '';
    try { senha = sessionStorage.getItem('zb-senha') || ''; } catch (e) {}
    if (!senha) { senha = window.prompt('Senha do painel'); if (!senha) return; }
    ui.publishing = true; renderSavebar();
    var done = function (msg) { ui.publishing = false; renderSavebar(); if (msg) toast(msg); };
    fetch('/api/publicar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha: senha, html: buildHtml(state) }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; }); })
      .then(function (r) {
        if (r.status === 200) {
          try { sessionStorage.setItem('zb-senha', senha); localStorage.removeItem('zb-rascunho'); } catch (e) {}
          saved = clone(state); ui.publishing = false; renderAll(); if ($('#admin').open) renderAdmin();
          toast('Publicado. A loja atualiza para todos em cerca de 1 minuto.');
        } else if (r.status === 401) {
          try { sessionStorage.removeItem('zb-senha'); } catch (e) {}
          done('Senha incorreta. Toque em Publicar e tente de novo.');
        } else if (r.status === 404) {
          done('A publicação direta ainda não está ativada no site. Use Baixar e envie pelo GitHub.');
        } else if (r.j && r.j.erro === 'config') {
          done('Faltam GITHUB_TOKEN e ADMIN_SENHA nas variáveis da Vercel.');
        } else if (r.j && r.j.erro === 'github') {
          done('O GitHub recusou a gravação (código ' + r.j.status + '). Confira o token na Vercel.');
        } else {
          done('Não foi possível publicar agora. Tente de novo ou use Baixar.');
        }
      }, function () { done('Sem conexão. Tente de novo em instantes.'); });
  }
  function setEditMode(on) {
    ui.editMode = on;
    document.documentElement.classList.toggle('editing', on);
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (el) {
      if (on) {
        try { el.contentEditable = 'plaintext-only'; } catch (e) { el.contentEditable = 'true'; }
        if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
        el.spellcheck = false;
      } else { el.removeAttribute('contenteditable'); }
    });
    renderInfo(); renderEditbar();
    if (on) toast('Toque em qualquer texto para mudar. Toque numa camisa para editar.');
  }
  function renderEditbar() {
    var bar = $('#editbar');
    bar.hidden = !ui.canEdit;
    if (!ui.canEdit) return;
    bar.innerHTML = ui.editMode ?
      '<p><b>Editando na tela.</b> Toque nos textos ou nas camisas.</p><button class="btn btn-sm btn-ink" data-action="edit-off">Concluir</button>' :
      '<button class="btn btn-sm btn-ink" data-action="edit-on">' + I.edit + ' Editar na tela</button><button class="btn btn-sm btn-line" data-action="open-admin">Painel</button>';
    bar.classList.toggle('on', !!ui.editMode);
  }
  document.addEventListener('input', function (e) {
    var el = e.target.closest && e.target.closest('[data-edit]');
    if (!el || !ui.editMode) return;
    var key = el.getAttribute('data-edit'), v = el.textContent.replace(/\s+/g, ' ').trim();
    if (key === 'announcement') state.settings.announcement = v;
    else { state.settings.texts = state.settings.texts || {}; state.settings.texts[key] = v; }
    renderSavebar();
  });
  document.addEventListener('keydown', function (e) {
    if (ui.editMode && e.key === 'Enter' && e.target.closest && e.target.closest('[data-edit]')) { e.preventDefault(); e.target.blur(); }
  });
  document.addEventListener('click', function (e) {
    if (ui.editMode && e.target.closest && e.target.closest('[data-edit]')) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  function draftKey() { var j = JSON.stringify(saved), h = 0; for (var i = 0; i < j.length; i++) h = (h * 31 + j.charCodeAt(i)) | 0; return String(h); }
  function enableStandalone() {
    if (ui.publisher || ui.standalone) return;
    ui.standalone = true; ui.canEdit = true;
    try { localStorage.setItem('zb-lojista', '1'); } catch (e) {}
    $('#admBtn').hidden = false;
    var d = null; try { d = JSON.parse(localStorage.getItem('zb-rascunho') || 'null'); } catch (e) {}
    if (d && d.base === draftKey() && d.state && JSON.stringify(d.state) !== JSON.stringify(saved)) { state = d.state; renderAll(); toast('Recuperamos alterações que você ainda não publicou.'); }
    else { try { localStorage.removeItem('zb-rascunho'); } catch (e) {} }
    renderSavebar(); renderEditbar();
  }
  function publish() {
    if ($('#sWa')) readSettings();
    if (ui.standalone) { publishSite(); return; }
    if (!ui.publisher) { toast('Para publicar, abra a loja pelo link do artefato no Claude.'); return; }
    ui.publishing = true; renderSavebar();
    try { sessionStorage.setItem('zb-draft', JSON.stringify(state)); } catch (e) {}
    ui.publisher.publish(buildHtml(state)).then(function () {
      toast('Loja publicada.');
    }, function (err) {
      var c = err && err.code;
      ui.publishing = false;
      if (c === 'conflict') { toast('Havia uma versão mais nova. Recarregando, suas alterações serão recuperadas.'); return; }
      try { sessionStorage.removeItem('zb-draft'); } catch (e) {}
      if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed') {
        toast('Esta visualização não permite publicar. Abra a loja pela sua conta no Claude.');
      } else if (c === 'too_large') {
        toast('A loja ficou pesada demais. Remova algumas fotos e tente de novo.');
      } else if (c === 'rate_limited') {
        toast('Muitas publicações seguidas. Espere um minuto e tente de novo.');
      } else {
        toast('Não foi possível publicar agora. Tente de novo em instantes.');
      }
      renderSavebar();
    });
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) {
      if (e.target.tagName === 'DIALOG') closeDialog(e.target);
      return;
    }
    var a = t.getAttribute('data-action');
    var k = Number(t.getAttribute('data-k')), dd = Number(t.getAttribute('data-d'));
    switch (a) {
      case 'cat': ui.cat = t.getAttribute('data-cat'); renderChips(); renderGrid(); break;
      case 'reset-filter': ui.cat = 'todos'; ui.q = ''; $('#q').value = ''; renderChips(); renderGrid(); break;
      case 'palmeiras':
        ui.cat = 'todos'; ui.q = 'Palmeiras'; $('#q').value = 'Palmeiras'; renderChips(); renderGrid();
        $('#camisas').scrollIntoView({ behavior: 'smooth' }); break;
      case 'quick-add': addToCart(t.getAttribute('data-id'), t.getAttribute('data-size'), 1); toast('Tamanho ' + t.getAttribute('data-size') + ' adicionado à sacola.'); break;
      case 'open-product':
        if (ui.editMode) { ui.form = clone(byId(t.getAttribute('data-id'))); if (!ui.form.art) ui.form.art = blankProduct().art; renderAdmin(); showDialog($('#admin')); renderSavebar(); break; }
        openProduct(t.getAttribute('data-id')); break;
      case 'edit-on': setEditMode(true); break;
      case 'edit-off': setEditMode(false); break;
      case 'leave-admin':
        try { localStorage.removeItem('zb-lojista'); } catch (e) {}
        setEditMode(false); ui.canEdit = false; ui.standalone = false; $('#admBtn').hidden = true; closeDialog($('#admin')); renderSavebar(); renderEditbar();
        toast('Você saiu do modo lojista neste aparelho.'); break;
      case 'close': closeDialog(t.closest('dialog')); break;
      case 'qty': ui.qty = Math.max(1, Math.min(20, ui.qty + dd)); $('#qtyOut').textContent = ui.qty; break;
      case 'to-measures': e.preventDefault(); closeDialog($('#pm')); setTimeout(function () { $('#medidas').scrollIntoView(); }, 50); break;
      case 'add': { var s = chosenSize(); if (!s) return; addToCart(ui.current, s, ui.qty); closeDialog($('#pm')); toast('Adicionada à sacola.'); break; }
      case 'buy-now': { var s2 = chosenSize(); if (!s2) return; sendOrder(orderMessage([{ p: byId(ui.current), size: s2, qty: ui.qty }])); break; }
      case 'ask-soldout': { var p = byId(ui.current); sendOrder('Olá! A camisa ' + p.name + (p.edition ? ' (' + p.edition + ')' : '') + ' vai voltar ao estoque?'); break; }
      case 'open-bag': renderBag(); showDialog($('#bag')); break;
      case 'go-shop': closeDialog($('#bag')); setTimeout(function () { $('#camisas').scrollIntoView(); }, 50); break;
      case 'bag-qty': { var it = bagKeyed()[k]; if (it) { it.qty = Math.max(1, Math.min(20, it.qty + dd)); store('zb-cart', cart); renderBag(); renderBagCount(); } break; }
      case 'bag-rm': { var it2 = bagKeyed()[k]; cart = cart.filter(function (i) { return i !== it2; }); store('zb-cart', cart); renderBag(); renderBagCount(); break; }
      case 'ig-go': { var ok = copyText($('#igText').value); setTimeout(function () { toast(ok ? 'Pedido copiado. Cole na conversa do Instagram.' : 'Copie o texto do pedido e cole na conversa.'); }, 300); return; }
      case 'checkout': sendOrder(orderMessage(cartItems())); break;
      case 'open-admin': ui.form = null; renderAdmin(); showDialog($('#admin')); renderSavebar(); break;
      case 'tab': if (ui.tab === 'config') readSettings(); ui.tab = t.getAttribute('data-tab'); renderAll(); renderAdmin(); break;
      case 'new-product': ui.form = blankProduct(); renderAdmin(); $('#admin .dr-body').scrollTop = 0; break;
      case 'edit-product': ui.form = clone(byId(t.getAttribute('data-id'))); if (!ui.form.art) ui.form.art = blankProduct().art; renderAdmin(); $('#admin .dr-body').scrollTop = 0; break;
      case 'cancel-form': ui.form = null; renderAdmin(); break;
      case 'save-form': saveForm(); break;
      case 'rm-photo': readForm(); ui.form.photo = ''; renderAdmin(); break;
      case 'delete-product': {
        var dp = byId(t.getAttribute('data-id'));
        if (dp && confirm('Excluir “' + dp.name + '” da loja?')) { state.products = state.products.filter(function (p) { return p !== dp; }); renderAll(); renderAdmin(); }
        break;
      }
      case 'move': {
        var j = k + dd; if (j < 0 || j >= state.products.length) return;
        var tmp = state.products[k]; state.products[k] = state.products[j]; state.products[j] = tmp;
        renderAll(); renderAdmin(); break;
      }
      case 'rm-logo': readSettings(); state.settings.logo = ''; renderAll(); renderAdmin(); break;
      case 'bulk-price': {
        readSettings();
        var bc = $('#bCat').value, bp = $('#bPrice').value.trim() ? parseMoney($('#bPrice').value) : 0, bo = $('#bOld').value.trim() ? parseMoney($('#bOld').value) : 0, bx = $('#bPix').value.trim() ? parseMoney($('#bPix').value) : 0;
        if (isNaN(bp) || isNaN(bo) || isNaN(bx)) { toast('Use valores como 189,90.'); return; }
        var nb = 0; state.products.forEach(function (p) { if (bc === 'todas' || p.category === bc) { p.price = bp; p.oldPrice = bo; p.pixPrice = bx; nb++; } });
        renderAll(); renderAdmin(); toast(nb + ' camisas atualizadas.'); break;
      }
      case 'faq-add': readSettings(); state.settings.faq.push({ q: '', a: '' }); renderAdmin(); break;
      case 'faq-rm': readSettings(); state.settings.faq.splice(k, 1); renderAll(); renderAdmin(); break;
      case 'discard':
        if (confirm('Descartar todas as alterações que ainda não foram publicadas?')) { try { localStorage.removeItem('zb-rascunho'); } catch (e) {} state = clone(saved); ui.form = null; renderAll(); if ($('#admin').open) renderAdmin(); }
        break;
      case 'download': downloadStore(); break;
      case 'publish': if (ui.form) { toast('Salve ou cancele a camisa que está editando antes de publicar.'); return; } publish(); break;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute('data-action') === 'toggle-sold') {
      var p = byId(t.getAttribute('data-id')); if (p) { p.soldOut = t.checked; renderAll(); }
    } else if (t.name === 'size') { var h = $('#sizeHint'); if (h) h.textContent = ''; }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; renderGrid(); }
    else if (e.target.id === 'sort') { ui.sort = e.target.value; renderGrid(); }
    else if (e.target.closest && e.target.closest('#admin') && $('#sWa') && !ui.form) { readSettings(); renderInfo(); renderSavebar(); renderGrid(); }
  });

  document.addEventListener('error', function (e) {
    var im = e.target;
    if (!im || im.tagName !== 'IMG') return;
    var src = im.getAttribute('src') || '', m;
    if ((m = src.match(/\/api\/img\?id=([\w-]+)/))) { im.src = 'https://lh3.googleusercontent.com/d/' + m[1] + '=w900'; return; }
    if ((m = src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/))) { im.src = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w900'; return; }
    swapBroken(im);
  }, true);
  function swapBroken(im) {
    var p = byId(im.getAttribute('data-pid') || '');
    if (p && im.parentNode) { var t = document.createElement('span'); t.innerHTML = shirtSvg(p.art, p.name); im.parentNode.replaceChild(t.firstChild, im); }
  }
  setInterval(function () {
    Array.prototype.forEach.call(document.querySelectorAll('img[data-pid]'), function (im) { if (im.complete && im.naturalWidth === 0 && /drive\.google\.com\/thumbnail/.test(im.getAttribute('src') || '')) swapBroken(im); });
  }, 2500);

  /* ---------- início ---------- */
  skeleton();
  tickFinal(); setInterval(tickFinal, 1000);
  ['pm', 'bag', 'admin', 'igd'].forEach(function (id) { $('#' + id).addEventListener('close', onDialogClose); });
  renderAll();

  function checkAdminHash() {
    var mem = false; try { mem = localStorage.getItem('zb-lojista') === '1'; } catch (e) {}
    if (location.hash === '#admin' || mem) { var first = !ui.standalone; enableStandalone(); if (first && location.hash === '#admin') { renderAdmin(); showDialog($('#admin')); } }
  }
  if (!(window.claude && typeof window.claude.use === 'function')) {
    window.addEventListener('hashchange', checkAdminHash);
    checkAdminHash();
  }
  if (window.claude && typeof window.claude.use === 'function') {
    Promise.all([window.claude.use('user'), window.claude.use('artifact')]).then(function (r) {
      ui.publisher = r[1];
      return r[0] ? r[0].canEdit() : false;
    }).then(function (can) {
      ui.canEdit = !!can;
      if (!ui.canEdit) return;
      $('#admBtn').hidden = false;
      var stash = null;
      try { stash = sessionStorage.getItem('zb-draft'); sessionStorage.removeItem('zb-draft'); } catch (e) {}
      if (stash && stash !== JSON.stringify(saved)) {
        try { state = JSON.parse(stash); renderAll(); toast('Recuperamos alterações que ainda não foram publicadas.'); } catch (e) {}
      }
      renderSavebar();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
